/* ============ DEFAULT DATA ============ */
const defaults={
  settings:{name:'হাজারীগঞ্জ মাধ্যমিক বিদ্যালয়',slogan:'জ্ঞান, নৈতিকতা ও উৎকর্ষতার আলোকবর্তিকা',founded:'১৯৭২',footer:'© ২০২৬ হাজারীগঞ্জ মাধ্যমিক বিদ্যালয়। সর্বস্বত্ব সংরক্ষিত।', eiin:'১০২২৩৪', schoolCode:'১২৩৪', shift:'দিবা', topBar:'বিদ্যালয়ে স্বাগতম! নিয়মিত ক্লাস ও পরীক্ষায় অংশগ্রহণ নিশ্চিত করুন।'},
  homepage:{sections:{hero:true,stats:true,notices:true,gallery:true,messages:true},sliders:[
    'https://images.unsplash.com/photo-1580582932707-520aed937b7b?w=1600&q=80',
    'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=1600&q=80'
  ]},
  contact:{address:'হাজারীগঞ্জ, লক্ষ্মীপুর, বাংলাদেশ',phone:'+৮৮০ ১৭০০-০০০০০০',email:'info@hazariganjschool.edu.bd',map:'https://maps.google.com/?q=Hazariganj+Bangladesh'},
  chairman:{photo:'https://randomuser.me/api/portraits/men/55.jpg',name:'মোঃ আবুল হোসেন',role:'সভাপতি, পরিচালনা পর্ষদ',bio:'দীর্ঘ ২৫ বছর ধরে শিক্ষাক্ষেত্রে অবদান রাখছেন।',message:'শিক্ষাই জাতির মেরুদণ্ড। আমাদের বিদ্যালয় সেই মেরুদণ্ড গঠনে প্রতিশ্রুতিবদ্ধ।'},
  headTeacher:{photo:'https://randomuser.me/api/portraits/men/11.jpg',name:'মোঃ আব্দুল করিম',role:'প্রধান শিক্ষক',bio:'এম.এ (বাংলা), বি.এড। শিক্ষকতায় ২০ বছরের অভিজ্ঞতা।',message:'প্রতিটি শিক্ষার্থীর সুপ্ত প্রতিভা বিকশিত করাই আমাদের লক্ষ্য।'},
  teachers:[{id:1,photo:'https://randomuser.me/api/portraits/men/11.jpg',name:'মোঃ আব্দুল করিম',role:'প্রধান শিক্ষক',subject:'বাংলা',phone:'০১৭১১-১১১১১১'}],
  employees:[{id:1,photo:'https://randomuser.me/api/portraits/men/16.jpg',name:'মোঃ আনোয়ার হোসেন',role:'অফিস সহকারী',phone:'০১৮১১-১১১১১১'}],
  students:[{cls:'ষষ্ঠ শ্রেণি',boys:110,girls:105},{cls:'সপ্তম শ্রেণি',boys:108,girls:102},{cls:'অষ্টম শ্রেণি',boys:100,girls:98},{cls:'নবম শ্রেণি',boys:165,girls:170},{cls:'দশম শ্রেণি',boys:156,girls:161}],
  notices:[{id:1,title:'বার্ষিক পরীক্ষার রুটিন প্রকাশ',body:'বার্ষিক পরীক্ষার রুটিন আজ প্রকাশ করা হলো।',date:'2026-05-20',status:'published'}],
  holidays:[{id:1,title:'ঈদুল ফিতর',reason:'ধর্মীয় ছুটি',start:'2026-04-10',end:'2026-04-15'}],
  albums:[{id:1,name:'বিদ্যালয়ের ছবি',cover:'https://images.unsplash.com/photo-1517649763962-0c623066013b?w=600',images:['https://images.unsplash.com/photo-1517649763962-0c623066013b?w=600']}],
  complaints:[],
  applications:[]
};

let DB = {};
let currentUser = null;

/* ============ FIREBASE AUTH & SYNC ============ */
auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    document.getElementById('userEmailLabel').textContent = user.email;
    syncWithFirebase();
  } else {
    document.getElementById('appLoader').classList.add('hidden');
    showLogin();
  }
});

document.getElementById('loginForm').onsubmit = e => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  
  btn.textContent = 'অপেক্ষা করুন...';
  btn.disabled = true;
  err.classList.add('hidden');

  auth.signInWithEmailAndPassword(email, pass)
    .catch(error => {
      // Auto create for demo purpose if not exists
      if(error.code === 'auth/user-not-found' && email === 'admin@hazariganj.edu.bd') {
        return auth.createUserWithEmailAndPassword(email, pass);
      }
      throw error;
    })
    .then(() => {
      btn.textContent = 'লগইন করুন';
      btn.disabled = false;
    })
    .catch(error => {
      let msg = 'লগইন ব্যর্থ হয়েছে।';
      if(error.code === 'auth/wrong-password') msg = 'পাসওয়ার্ড ভুল হয়েছে।';
      else if(error.code === 'auth/user-not-found') msg = 'এই ইমেইলে কোনো অ্যাকাউন্ট নেই।';
      err.textContent = msg;
      err.classList.remove('hidden');
      btn.textContent = 'লগইন করুন';
      btn.disabled = false;
    });
};

function logout(){
  auth.signOut();
}

function syncWithFirebase() {
  database.ref('hgs_school_data').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
      // Ensure new nodes exist
      if(!data.applications) data.applications = [];
      if(!data.settings.eiin) data.settings.eiin = defaults.settings.eiin;
      if(!data.settings.schoolCode) data.settings.schoolCode = defaults.settings.schoolCode;
      if(!data.settings.shift) data.settings.shift = defaults.settings.shift;
      if(!data.settings.topBar) data.settings.topBar = defaults.settings.topBar;
      DB = data;
    } else {
      DB = defaults;
      save();
    }
    
    document.getElementById('appLoader').classList.add('hidden');
    showApp();
  });
}

function save() {
  database.ref('hgs_school_data').set(DB)
    .catch(err => toast("সিঙ্ক সমস্যা: " + err.message, 1));
}

/* ============ HELPERS ============ */
function nextId(arr){return arr&&arr.length?Math.max(...arr.map(x=>x.id))+1:1}
function toBn(n){return String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d])}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(msg,err){const d=document.createElement('div');d.className='toast';if(err)d.style.background='#dc2626';d.innerHTML=`<div class="flex items-center gap-2"><span>${err?'⚠️':'✅'}</span> ${msg}</div>`;document.getElementById('toastRoot').appendChild(d);setTimeout(()=>d.remove(),3000)}
function confirmAct(msg){return confirm(msg)}

/* ============ UI CONTROLS ============ */
function showLogin(){
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
function showApp(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderNav();
  go(current); 
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  sb.classList.toggle('-translate-x-full');
  overlay.classList.toggle('hidden');
}

/* ============ NAVIGATION ============ */
const PAGES=[
  {id:'dashboard',icon:'🏠',label:'ড্যাশবোর্ড'},
  {id:'applications',icon:'📝',label:'আবেদন ব্যবস্থাপনা'},
  {id:'complaints',icon:'📨',label:'অভিযোগ ব্যবস্থাপনা'},
  {id:'teachers',icon:'👨‍🏫',label:'শিক্ষক ব্যবস্থাপনা'},
  {id:'employees',icon:'👨‍💼',label:'কর্মচারী ব্যবস্থাপনা'},
  {id:'students',icon:'👨‍🎓',label:'শিক্ষার্থী ব্যবস্থাপনা'},
  {id:'notices',icon:'📢',label:'নোটিশ ব্যবস্থাপনা'},
  {id:'holidays',icon:'📅',label:'ছুটির ব্যবস্থাপনা'},
  {id:'gallery',icon:'🖼️',label:'গ্যালারি ব্যবস্থাপনা'},
  {id:'chairman',icon:'👨‍💼',label:'সভাপতির পরিচিতি'},
  {id:'headTeacher',icon:'👨‍🏫',label:'প্রধান শিক্ষক'},
  {id:'contact',icon:'📞',label:'যোগাযোগ তথ্য'},
  {id:'settings',icon:'⚙️',label:'ওয়েবসাইট সেটিংস'},
  {id:'security',icon:'🔐',label:'নিরাপত্তা ও ব্যাকআপ'}
];

let current='dashboard';

function renderNav(){
  const navMenu = document.getElementById('navMenu');
  navMenu.innerHTML=PAGES.map(p=>`<button class="nav-btn ${p.id===current?'active':''}" onclick="go('${p.id}')"><span class="text-lg w-6 text-center">${p.icon}</span><span class="flex-grow text-left">${p.label}</span></button>`).join('')
}

function go(p){
  current=p;
  renderNav();
  document.getElementById('pageTitle').textContent=PAGES.find(x=>x.id===p).label;
  
  // Close sidebar on mobile after clicking
  if(window.innerWidth<1024) {
    document.getElementById('sidebar').classList.add('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.add('hidden');
  }
  
  PAGE_RENDERERS[p]();
}

/* ============ MODAL ============ */
function openModal(html){modalRoot.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal p-6 md:p-8 animate-[slideIn_0.2s_ease-out]">${html}</div></div>`}
function closeModal(){modalRoot.innerHTML=''}

/* ============ PAGE RENDERERS ============ */
const PAGE_RENDERERS={};

PAGE_RENDERERS.dashboard=()=>{
  const totalStu=(DB.students||[]).reduce((a,c)=>a+c.boys+c.girls,0);
  const pendingApps=(DB.applications||[]).filter(a=>a.status==='pending').length;

function statusBadge(s){
  const m={

    read:['পঠিত','bg-blue-100 text-blue-700 border border-blue-200'],
    approved:['অনুমোদিত','bg-emerald-100 text-emerald-700 border border-emerald-200'],
    rejected:['বাতিল','bg-red-100 text-red-700 border border-red-200'],
    resolved:['সমাধানকৃত','bg-emerald-100 text-emerald-700 border border-emerald-200']
  };
  const x=m[s]||['অজানা','bg-slate-100 border border-slate-200'];
  return `<span class="badge ${x[1]}">${x[0]}</span>`;
}

    <div class="flex justify-end mb-4"><button class="btn btn-gold shadow-md" onclick="noticeForm()">+ নতুন নোটিশ প্রকাশ</button></div>
    <div class="card table-responsive"><table><thead><tr><th>নোটিশের শিরোনাম</th><th>তারিখ</th><th>স্ট্যাটাস</th><th class="text-right">অ্যাকশন</th></tr></thead>
    <tbody>${(DB.notices||[]).slice().reverse().map(n=>`<tr>
      <td><div class="font-bold text-primary whitespace-normal max-w-sm line-clamp-1">${esc(n.title)}</div></td><td>${toBn(n.date)}</td>
      <td>${n.status==='published'?'<span class="badge bg-green-100 text-green-700">প্রকাশিত</span>':'<span class="badge bg-amber-100 text-amber-700">খসড়া</span>'}</td>
      <td class="text-right"><button class="btn btn-outline text-xs" onclick="noticeForm(${n.id})">এডিট</button> <button class="btn btn-danger text-xs" onclick="delNotice(${n.id})">ডিলিট</button></td>
    </tr>`).join('')||'<tr><td colspan="4" class="text-center py-10 text-slate-500 font-medium">কোনো নোটিশ নেই।</td></tr>'}</tbody></table></div>`;
};
function noticeForm(id){
  const t=id?DB.notices.find(x=>x.id===id):{title:'',body:'',date:new Date().toISOString().slice(0,10),status:'published'};
  openModal(`<h3 class="serif text-xl font-bold mb-4 border-b pb-2">${id?'নোটিশ এডিট করুন':'নতুন নোটিশ লিখুন'}</h3>
    <form onsubmit="saveNotice(event,${id||'null'})" class="space-y-4">
      <div><label class="label">শিরোনাম *</label><input class="input font-bold" name="title" value="${esc(t.title)}" required></div>
      <div><label class="label">বিস্তারিত বিবরণ *</label><textarea class="textarea" name="body" rows="6" required>${esc(t.body)}</textarea></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="label">প্রকাশের তারিখ</label><input type="date" class="input" name="date" value="${esc(t.date)}"></div>
        <div><label class="label">স্ট্যাটাস</label><select class="select" name="status"><option value="published" ${t.status==='published'?'selected':''}>ওয়েবসাইটে প্রকাশ করুন</option><option value="draft" ${t.status==='draft'?'selected':''}>খসড়া হিসেবে রাখুন</option></select></div>
      </div>
      <div class="flex gap-2 justify-end pt-4 border-t"><button type="button" class="btn btn-outline" onclick="closeModal()">বাতিল</button><button class="btn btn-primary">সেভ করুন</button></div>
    </form>`);
}
function saveNotice(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!DB.notices)DB.notices=[];if(id){Object.assign(DB.notices.find(x=>x.id===id),f)}else{DB.notices.push({id:nextId(DB.notices),...f})}save();closeModal();PAGE_RENDERERS.notices();toast('সফলভাবে সংরক্ষিত')}
function delNotice(id){if(confirmAct('এই নোটিশটি মুছে ফেলবেন?')){DB.notices=DB.notices.filter(x=>x.id!==id);save();PAGE_RENDERERS.notices();toast('মুছে ফেলা হয়েছে')}}

    <div class="card table-responsive"><table><thead><tr><th>ছুটির বিবরণ</th><th>কারণ</th><th>শুরুর তারিখ</th><th>শেষের তারিখ</th><th class="text-right">অ্যাকশন</th></tr></thead>
    <tbody>${(DB.holidays||[]).map(h=>`<tr>
      <td class="font-bold text-red-600">${esc(h.title)}</td><td>${esc(h.reason)}</td><td class="font-medium">${toBn(h.start)}</td><td class="font-medium">${toBn(h.end)}</td>
      <td class="text-right"><button class="btn btn-outline text-xs" onclick="holForm(${h.id})">এডিট</button> <button class="btn btn-danger text-xs" onclick="delHol(${h.id})">ডিলিট</button></td>
    </tr>`).join('')||'<tr><td colspan="5" class="text-center py-10 text-slate-500 font-medium">কোনো ছুটির তালিকা নেই।</td></tr>'}</tbody></table></div>`;
};
function holForm(id){

  openModal(`<h3 class="serif text-xl font-bold mb-4 border-b pb-2">${id?'ছুটি এডিট':'নতুন ছুটি এন্ট্রি'}</h3>
    <form onsubmit="saveHol(event,${id||'null'})" class="space-y-4">
      <div><label class="label">ছুটির নাম/বিবরণ *</label><input class="input font-bold" name="title" value="${esc(t.title)}" required></div>
      <div><label class="label">কারণ (ঐচ্ছিক)</label><input class="input" name="reason" value="${esc(t.reason)}"></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="label">শুরুর তারিখ *</label><input type="date" class="input" name="start" value="${esc(t.start)}" required></div>
        <div><label class="label">শেষের তারিখ *</label><input type="date" class="input" name="end" value="${esc(t.end)}" required></div>
      </div>
      <div class="flex gap-2 justify-end pt-4 border-t"><button type="button" class="btn btn-outline" onclick="closeModal()">বাতিল</button><button class="btn btn-primary">সেভ করুন</button></div>
    </form>`);
}
function saveHol(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!DB.holidays)DB.holidays=[];if(id){Object.assign(DB.holidays.find(x=>x.id===id),f)}else{DB.holidays.push({id:nextId(DB.holidays),...f})}save();closeModal();PAGE_RENDERERS.holidays();toast('সফলভাবে সংরক্ষিত')}
function delHol(id){if(confirmAct('এই ছুটিটি মুছে ফেলবেন?')){DB.holidays=DB.holidays.filter(x=>x.id!==id);save();PAGE_RENDERERS.holidays();toast('মুছে ফেলা হয়েছে')}}

/* ===== GALLERY ===== */
PAGE_RENDERERS.gallery=()=>{
  document.getElementById('mainContent').innerHTML=`
    <div class="flex justify-end mb-4"><button class="btn btn-gold shadow-md" onclick="albumForm()">+ নতুন ফটো অ্যালবাম</button></div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">${(DB.albums||[]).map(a=>`
      <div class="card overflow-hidden group">
        <div class="relative h-48 overflow-hidden">
          <img src="${esc(a.cover)}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://via.placeholder.com/400x300'">
          <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex flex-col justify-end p-4">
            <h3 class="font-bold serif text-white text-lg leading-tight">${esc(a.name)}</h3>
            <p class="text-xs text-yellow-300 font-bold mt-1">${toBn((a.images||[]).length)} টি ছবি</p>
          </div>
        </div>
        <div class="p-4 bg-slate-50 flex gap-2 justify-center border-t border-slate-100">
          <button class="btn btn-primary text-xs flex-1" onclick="manageImages(${a.id})">🖼️ ছবি পরিচালনা</button>
          <button class="btn btn-outline text-xs px-3" onclick="albumForm(${a.id})">✏️</button>
          <button class="btn btn-danger text-xs px-3" onclick="delAlbum(${a.id})">🗑️</button>
        </div>
      </div>`).join('')||'<div class="col-span-full text-center py-10 text-slate-500 font-medium">কোনো অ্যালবাম তৈরি করা হয়নি।</div>'}</div>`;
};
function albumForm(id){
  const a=id?DB.albums.find(x=>x.id===id):{name:'',cover:'',images:[]};
  openModal(`<h3 class="serif text-xl font-bold mb-4 border-b pb-2">${id?'অ্যালবাম এডিট':'নতুন অ্যালবাম তৈরি'}</h3>
    <form onsubmit="saveAlbum(event,${id||'null'})" class="space-y-4">
      <div><label class="label">অ্যালবামের নাম *</label><input class="input font-bold" name="name" value="${esc(a.name)}" required></div>
      <div><label class="label">কভার ছবির লিংক (URL) *</label><input class="input" name="cover" value="${esc(a.cover)}" required></div>
      <div class="flex gap-2 justify-end pt-4 border-t"><button type="button" class="btn btn-outline" onclick="closeModal()">বাতিল</button><button class="btn btn-primary">সেভ করুন</button></div>
    </form>`);
}
function saveAlbum(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!DB.albums)DB.albums=[];if(id){Object.assign(DB.albums.find(x=>x.id===id),f)}else{DB.albums.push({id:nextId(DB.albums),...f,images:[f.cover]})}save();closeModal();PAGE_RENDERERS.gallery();toast('সফলভাবে সংরক্ষিত')}
function delAlbum(id){if(confirmAct('পুরো অ্যালবাম এবং এর সব ছবি মুছে ফেলবেন?')){DB.albums=DB.albums.filter(x=>x.id!==id);save();PAGE_RENDERERS.gallery();toast('মুছে ফেলা হয়েছে')}}
function manageImages(id){
  const a=DB.albums.find(x=>x.id===id);
  const imgs = a.images || [];
  openModal(`<h3 class="serif text-xl font-bold mb-4 border-b pb-2">${esc(a.name)} <span class="text-sm font-normal text-slate-500 block sm:inline sm:ml-2">ছবি ব্যবস্থাপনা</span></h3>
    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-4">
      <label class="label text-primary">নতুন ছবির লিংক যোগ করুন (প্রতি লাইনে একটি লিংক)</label>
      <textarea id="bulkImgs" class="textarea mb-2" rows="3" placeholder="https://image-link-1.jpg&#10;https://image-link-2.jpg"></textarea>
      <button class="btn btn-gold text-sm w-full sm:w-auto" onclick="addImgs(${id})">+ ছবিগুলো গ্যালারিতে যোগ করুন</button>
    </div>
    <label class="label">অ্যালবামে থাকা ছবিসমূহ:</label>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-64 overflow-y-auto p-1">
      ${imgs.map((u,i)=>`<div class="relative group rounded-lg overflow-hidden shadow-sm border border-slate-200">
        <img src="${esc(u)}" class="w-full h-24 object-cover" onerror="this.src='https://via.placeholder.com/150'">
        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
          <button onclick="rmImg(${id},${i})" class="bg-red-600 hover:bg-red-700 text-white p-2 rounded-full shadow text-xs font-bold">মুছুন</button>
        </div>
      </div>`).join('')||'<p class="col-span-full text-sm text-slate-500 text-center py-4">এই অ্যালবামে কোনো ছবি নেই।</p>'}
    </div>
    <div class="flex justify-end mt-4 pt-4 border-t"><button class="btn btn-outline bg-slate-100" onclick="closeModal()">বন্ধ করুন</button></div>`);
}
function addImgs(id){const urls=document.getElementById('bulkImgs').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!urls.length)return;const a=DB.albums.find(x=>x.id===id);if(!a.images)a.images=[];a.images.push(...urls);save();manageImages(id);PAGE_RENDERERS.gallery();toast(toBn(urls.length)+' টি ছবি যোগ হয়েছে')}
function rmImg(id,i){if(!confirmAct('এই ছবিটি মুছে ফেলবেন?'))return;const a=DB.albums.find(x=>x.id===id);a.images.splice(i,1);save();manageImages(id);PAGE_RENDERERS.gallery()}

/* ===== CHAIRMAN / HEAD TEACHER ===== */
function personForm(key,title){
  const p=DB[key] || {photo:'',name:'',role:'',bio:'',message:''};
  document.getElementById('mainContent').innerHTML=`<div class="card p-6 lg:p-8 max-w-3xl mx-auto shadow-lg">
    <h2 class="serif text-2xl font-bold mb-6 text-primary border-b pb-2">${title}</h2>
    <form onsubmit="savePerson(event,'${key}')" class="space-y-5">
      <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
        <img id="pPreview" src="${esc(p.photo)}" class="w-32 h-32 rounded-lg object-cover border-4 border-white shadow-md bg-white" onerror="this.src='https://via.placeholder.com/150'">
        <div class="w-full">
          <label class="label">ছবির লিংক (URL)</label>
          <input class="input" name="photo" value="${esc(p.photo)}" oninput="document.getElementById('pPreview').src=this.value">
          <p class="text-xs text-slate-500 mt-2">বর্গাকার (Square) ছবি ব্যবহার করলে ভালো দেখাবে।</p>
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-5">
        <div><label class="label">সম্পূর্ণ নাম *</label><input class="input font-bold text-lg" name="name" value="${esc(p.name)}" required></div>
        <div><label class="label">পদবি *</label><input class="input" name="role" value="${esc(p.role)}" required></div>
      </div>
      <div><label class="label">সংক্ষিপ্ত পরিচিতি</label><textarea class="textarea" name="bio" rows="3" placeholder="শিক্ষাগত যোগ্যতা বা অভিজ্ঞতা...">${esc(p.bio)}</textarea></div>
      <div><label class="label">বাণী (Message)</label><textarea class="textarea leading-relaxed" name="message" rows="6" placeholder="শিক্ষার্থী ও অভিভাবকদের উদ্দেশ্যে বার্তা...">${esc(p.message)}</textarea></div>
      <div class="pt-4 border-t"><button class="btn btn-gold text-lg px-8 py-3 w-full sm:w-auto shadow-md">সংরক্ষণ করুন</button></div>
    </form></div>`;
}
function savePerson(e,k){e.preventDefault();DB[k]=Object.fromEntries(new FormData(e.target));save();toast('সফলভাবে সংরক্ষিত হয়েছে')}
PAGE_RENDERERS.chairman=()=>personForm('chairman','সভাপতি মহোদয়ের পরিচিতি ও বাণী');
PAGE_RENDERERS.headTeacher=()=>personForm('headTeacher','প্রধান শিক্ষকের পরিচিতি ও বাণী');

        <div class="space-y-1 bg-slate-50 p-2 rounded border border-slate-100">
          ${Object.entries(h.sections||{}).map(([k,v])=>`<div class="flex items-center justify-between p-3 bg-white rounded shadow-sm border border-slate-100">
            <span class="font-bold text-slate-700">${({hero:'হিরো স্লাইডার সেকশন',stats:'পরিসংখ্যান (শিক্ষার্থী/শিক্ষক)',notices:'নোটিশ বোর্ড',gallery:'ফটো গ্যালারি',messages:'সভাপতি ও প্রধান শিক্ষকের বাণী'})[k]||k}</span>
            <label class="switch"><input type="checkbox" ${v?'checked':''} onchange="DB.homepage.sections['${k}']=this.checked;save()"><span class="slider"></span></label>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
};
function saveSet(e){e.preventDefault();DB.settings=Object.fromEntries(new FormData(e.target));save();toast('ওয়েবসাইটের তথ্য আপডেট হয়েছে')}
function saveSliders(){DB.homepage.sliders=document.getElementById('sliderText').value.split('\n').map(s=>s.trim()).filter(Boolean);save();toast('স্লাইডারের ছবি আপডেট হয়েছে')}

PAGE_RENDERERS.security=()=>{
  document.getElementById('mainContent').innerHTML=`
  <div class="grid md:grid-cols-2 gap-6 items-start">
    <div class="card p-6 shadow-sm border border-slate-200">
      <h3 class="serif font-bold text-xl mb-6 text-slate-800 flex items-center gap-2"><span>🔐</span> অ্যাডমিন পাসওয়ার্ড পরিবর্তন</h3>
      <form onsubmit="changeFirebasePass(event)" class="space-y-4">
        <div><label class="label">অ্যাডমিন ইমেইল</label><input type="email" class="input bg-slate-100 text-slate-500 font-bold" value="${currentUser?currentUser.email:''}" disabled></div>
        <div><label class="label">নতুন পাসওয়ার্ড দিন *</label><input type="password" class="input" id="newPass1" required minlength="6" placeholder="কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড"></div>
        <div><label class="label">পুনরায় নতুন পাসওয়ার্ড দিন *</label><input type="password" class="input" id="newPass2" required minlength="6"></div>
        <div class="pt-2"><button class="btn btn-primary w-full py-3">পাসওয়ার্ড আপডেট করুন</button></div>
        <p class="text-xs text-slate-500 mt-2 text-center">নিরাপত্তার স্বার্থে পাসওয়ার্ড পরিবর্তন করার পর আপনাকে পুনরায় লগইন করতে হতে পারে।</p>
      </form>
    </div>
    
    <div class="card p-6 shadow-md border-2 border-red-500 bg-red-50/30">
      <h3 class="serif font-bold text-xl mb-2 text-red-700 flex items-center gap-2"><span>⚠️</span> ডেঞ্জার জোন (Danger Zone)</h3>
      <p class="text-sm text-red-600 mb-6 font-medium">সতর্কতার সাথে এই অপশনগুলো ব্যবহার করুন। এখান থেকে ওয়েবসাইটের সমস্ত ডেটা ব্যাকআপ বা মুছে ফেলা সম্ভব।</p>
      
      <div class="space-y-4">
        <div class="bg-white p-4 rounded-lg border border-red-200 flex flex-col sm:flex-row items-center justify-between gap-4">
           <div>
             <h4 class="font-bold text-slate-800">ডেটা ব্যাকআপ নিন (Export)</h4>
             <p class="text-xs text-slate-500 mt-1">ওয়েবসাইটের সম্পূর্ণ ডেটাবেস JSON ফাইল হিসেবে ডাউনলোড করুন।</p>
           </div>
           <button class="btn btn-outline border-blue-300 text-blue-700 hover:bg-blue-50 whitespace-nowrap w-full sm:w-auto" onclick="exportData()">📥 ডাউনলোড করুন</button>
        </div>
        
        <div class="bg-white p-4 rounded-lg border border-red-200 flex flex-col sm:flex-row items-center justify-between gap-4">
           <div>
             <h4 class="font-bold text-slate-800">ডেটা রিস্টোর করুন (Import)</h4>
             <p class="text-xs text-slate-500 mt-1">পূর্বে সেভ করা JSON ফাইল আপলোড করে ডেটাবেস রিস্টোর করুন।</p>
           </div>
           <button class="btn btn-outline border-purple-300 text-purple-700 hover:bg-purple-50 whitespace-nowrap w-full sm:w-auto" onclick="importData()">📤 আপলোড করুন</button>
        </div>
        
        <div class="bg-red-100 p-4 rounded-lg border border-red-300 flex flex-col sm:flex-row items-center justify-between gap-4 mt-6">
           <div>
             <h4 class="font-bold text-red-800">সমস্ত ডেটা রিসেট করুন</h4>
             <p class="text-xs text-red-600 mt-1">ওয়েবসাইটের বর্তমান সমস্ত তথ্য মুছে ডিফল্ট অবস্থায় ফিরে যাবে।</p>
           </div>
           <button class="btn btn-danger whitespace-nowrap w-full sm:w-auto shadow-lg" onclick="resetData()">🗑️ রিসেট করুন</button>

      </div>
    </div>
  </div>`;
};

function changeFirebasePass(e){
  e.preventDefault();
  const p1 = document.getElementById('newPass1').value;
  const p2 = document.getElementById('newPass2').value;
  if(p1 !== p2) return toast('দুটি পাসওয়ার্ড মিলছে না। আবার চেষ্টা করুন।', 1);
  
  if(currentUser){
    currentUser.updatePassword(p1).then(() => {
      toast('সফলভাবে পাসওয়ার্ড পরিবর্তন করা হয়েছে।');
      e.target.reset();
    }).catch(error => {
      if(error.code === 'auth/requires-recent-login'){
        toast('নিরাপত্তার কারণে আপনাকে লগআউট করে আবার লগইন করতে হবে।', 1);
        setTimeout(logout, 3000);
      } else {
        toast('ত্রুটি: ' + error.message, 1);
      }
    });
  }
}

function exportData(){
  const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='hazariganj-school-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function importData(){
  const i=document.createElement('input');
  i.type='file';i.accept='.json';
  i.onchange=e=>{
    const r=new FileReader();
    r.onload=()=>{
      try{
        const importedData = JSON.parse(r.result);
        if(!importedData.settings) throw new Error("Invalid Data");
        DB=importedData;
        save();
        toast('সফলভাবে ডেটা ইম্পোর্ট হয়েছে। পেজ রিলোড হচ্ছে...');
        setTimeout(()=>location.reload(), 2000);
      }catch(err){
        toast('ইম্পোর্ট ব্যর্থ হয়েছে। সঠিক JSON ফাইল নির্বাচন করুন।',1);
      }
    };
    r.readAsText(e.target.files[0]);
  };
  i.click();
}

function resetData(){
  if(confirm('সতর্কতা: আপনি কি নিশ্চিত যে আপনি ওয়েবসাইটের সমস্ত বর্তমান তথ্য মুছে ফেলতে চান? এই অ্যাকশনটি ফেরানো সম্ভব নয়!')){
    const confirmText = prompt('রিসেট নিশ্চিত করতে "RESET" টাইপ করুন:');
    if(confirmText === 'RESET') {
      database.ref('hgs_school_data').remove().then(() => {
        alert('ডেটাবেস সফলভাবে রিসেট করা হয়েছে।');
        location.reload();
      });
    } else {
      toast('রিসেট বাতিল করা হয়েছে।', 1);
    }
  }
}
</script>
